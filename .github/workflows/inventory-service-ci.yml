name: Inventory Service CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make mvnw executable
        working-directory: ./inventory-service
        run: chmod +x mvnw

      - name: Run tests
        working-directory: ./inventory-service
        run: ./mvnw test