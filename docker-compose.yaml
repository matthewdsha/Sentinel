services:
  order-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=orders
      - POSTGRES_USER=${ORDERS_USERNAME}
      - POSTGRES_PASSWORD=${ORDERS_PASSWORD}
  inventory-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=${INVENTORY_USERNAME}
      - POSTGRES_PASSWORD=${INVENTORY_PASSWORD}
  notification-redis:
    image: redis:7
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  order-service:
    build: ./order-service
    depends_on:
      - order-db
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/orders
      - ORDERS_USERNAME=${ORDERS_USERNAME}
      - ORDERS_PASSWORD=${ORDERS_PASSWORD}
  inventory-service:
    build: ./inventory-service
    depends_on:
      - inventory-db
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory
      - INVENTORY_USERNAME=${INVENTORY_USERNAME}
      - INVENTORY_PASSWORD=${INVENTORY_PASSWORD}
  notification-service:
    build: ./notification-service
    depends_on:
      - notification-redis
      - kafka
    environment:
      SPRING_DATA_REDIS_HOST: notification-redis
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - inventory-service
      - notification-service
