spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**
            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/inventory/**
            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/notifications/**