server:
  port: 8083

spring:
  data:
    redis:
      host: localhost
      port: 6380
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: inventoryReserved:com.sentinel.notification_service.event.InventoryReservedEvent,inventoryRejected:com.sentinel.notification_service.event.InventoryRejectedEvent