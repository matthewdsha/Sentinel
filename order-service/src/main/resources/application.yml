spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://order-db:5432/orders
    username: ${ORDERS_USERNAME}
    password: ${ORDERS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderCreated:com.sentinel.order_service.event.OrderCreatedEvent
    consumer:
      group-id: order-service
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: inventoryReserved:com.sentinel.order_service.event.InventoryReservedEvent,inventoryRejected:com.sentinel.order_service.event.InventoryRejectedEvent

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${spring.profiles.active:default}