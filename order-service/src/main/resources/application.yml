spring:
  datasource:
    url: jdbc:postgresql://order-db:5432/orders
    username: ${ORDERS_USERNAME}
    password: ${ORDERS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderCreated:com.sentinel.order_service.event.OrderCreatedEvent
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: inventoryReserved:com.sentinel.order_service.event.InventoryReservedEvent,inventoryRejected:com.sentinel.order_service.event.InventoryRejectedEvent